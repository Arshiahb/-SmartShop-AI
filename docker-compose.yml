services:
  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartshop}
      POSTGRES_USER: ${POSTGRES_USER:-smartshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartshop} -d ${POSTGRES_DB:-smartshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
